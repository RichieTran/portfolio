services:
  - type: web
    name: portfolio-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        value: https://richietran.com

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
